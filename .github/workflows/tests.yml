name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, zip
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer test:coverage -- --coverage-clover=coverage/host.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-coverage
          path: coverage/host.xml
  music-projects:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/music-projects
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo_sqlite
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer test:coverage -- --coverage-clover=coverage/projects.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projects-coverage
          path: modules/music-projects/coverage/projects.xml
  music-media-library:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/music-media-library
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo_sqlite, zip
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer test:coverage -- --coverage-clover=coverage/media.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-coverage
          path: modules/music-media-library/coverage/media.xml

  music-projects-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/music-projects-api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo_sqlite
          coverage: pcov
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npx --yes @redocly/cli@2.15.0 lint openapi/projects.json
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpstan analyse src --level=5 --no-progress --memory-limit=512M
      - run: composer test:coverage -- --coverage-clover=coverage/api.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projects-api-coverage
          path: modules/music-projects-api/coverage/api.xml

  music-media-library-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/music-media-library-api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo_sqlite, zip
          coverage: pcov
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npx --yes @redocly/cli@2.15.0 lint openapi/media.json
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpstan analyse src --level=5 --no-progress --memory-limit=512M
      - run: composer test:coverage -- --coverage-clover=coverage/api.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-api-coverage
          path: modules/music-media-library-api/coverage/api.xml

  music-projects-livewire:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/music-projects-livewire
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo_sqlite
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpstan analyse src --level=5 --no-progress --memory-limit=512M
      - run: composer test:coverage -- --coverage-clover=coverage/livewire.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projects-livewire-coverage
          path: modules/music-projects-livewire/coverage/livewire.xml

  music-projects-livewire-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:3xVFJ5tTr05dWL1gsJqF+UvWdv3X0Cz/CBaUG47hb3U=
      APP_URL: http://127.0.0.1:8743
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ runner.temp }}/music-livewire-browser.sqlite
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: database
      SESSION_CONNECTION: sqlite
      SESSION_DOMAIN: 'null'
      SESSION_SECURE_COOKIE: 'false'
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BCRYPT_ROUNDS: '4'
      MODULES_ENABLED: music-projects-livewire
      MUSIC_BROWSER_URL: http://127.0.0.1:8743
      MUSIC_BROWSER_EMAIL: browser-musician@example.test
      MUSIC_BROWSER_PASSWORD: Browser-Test-Password-42!
      MUSIC_BROWSER_OUTPUT: ${{ runner.temp }}/music-browser-artifacts
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/music-browser-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: touch "$DB_DATABASE"
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npm run build
      - run: npm ci --ignore-scripts --prefix modules/music-projects-livewire
      - run: modules/music-projects-livewire/node_modules/.bin/playwright install --with-deps chromium
      - run: php artisan migrate --force
      - name: Seed disposable browser identity and workspace
        run: |
          python3 - <<'PY'
          import subprocess
          code = r"""
          require 'vendor/autoload.php';
          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $user = App\Models\User::factory()->create(['name' => 'Browser Musician', 'email' => getenv('MUSIC_BROWSER_EMAIL'), 'password' => Illuminate\Support\Facades\Hash::make(getenv('MUSIC_BROWSER_PASSWORD'))]);
          $team = Liberu\Foundation\Organizations\Models\Team::factory()->create(['user_id' => $user->id, 'name' => 'Browser studio', 'personal_team' => true]);
          $user->forceFill(['current_team_id' => $team->id])->save();
          setPermissionsTeamId($team->id);
          $role = Spatie\Permission\Models\Role::firstOrCreate(['name' => config('filament-shield.super_admin.name', 'super_admin'), 'guard_name' => 'web', 'team_id' => $team->id]);
          $user->assignRole($role);
          file_put_contents(getenv('GITHUB_ENV'), 'MUSIC_BROWSER_WORKSPACE='.$team->id.PHP_EOL, FILE_APPEND);
          """
          subprocess.run(['php', '-r', code], check=True)
          PY
      - name: Start disposable web host
        run: php artisan serve --host=127.0.0.1 --port=8743 --no-reload > "$RUNNER_TEMP/music-browser-server.log" 2>&1 &
      - run: curl --retry 30 --retry-connrefused --retry-delay 1 --silent --fail "$MUSIC_BROWSER_URL/login" > /dev/null
      - run: npm --prefix modules/music-projects-livewire run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projects-livewire-browser
          path: |
            ${{ runner.temp }}/music-browser-artifacts
            ${{ runner.temp }}/music-browser-server.log
