name: Install

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none
      - run: composer validate
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer test
